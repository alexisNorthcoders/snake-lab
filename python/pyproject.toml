[project]
name = "snake-lab"
version = "0.1.0"
description = "The lab's Python half: a vectorised environment over the TypeScript engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "gymnasium>=1.0"]

[dependency-groups]
dev = ["pytest>=8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snake_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
